<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topografické funkce</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:rgba(0,0,0,.87);--muted:rgba(0,0,0,.54);--line:rgba(0,0,0,.12);--card:#f5f5f5;--accent:#009485;--accent-fg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2129;--fg:rgba(226,228,233,.82);--muted:rgba(226,228,233,.56);--line:rgba(226,228,233,.12);--card:#262a36;--accent:#009485;--accent-fg:#fff}}
:root[data-theme="dark"]{--bg:#1e2129;--fg:rgba(226,228,233,.82);--muted:rgba(226,228,233,.56);--line:rgba(226,228,233,.12);--card:#262a36;--accent:#009485;--accent-fg:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;padding:4px 2px;max-width:900px;margin:0 auto}
@media (max-width:600px){.wrap{grid-template-columns:1fr}}
.tabs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.tabs button:hover{border-color:var(--accent)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.map{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:1;background:#000;cursor:crosshair}
.map canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.marker{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;background:#e53935;box-shadow:0 0 0 1px #000;pointer-events:none;display:none}
.north{position:absolute;top:6px;right:8px;color:#fff;font:bold 12px system-ui;text-shadow:0 0 3px #000;pointer-events:none;text-align:center;line-height:1}
.below{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.readout{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);min-height:1.4em}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.panel h3{margin:0 0 2px;font-size:17px}
.tool{font-size:12px;color:var(--muted);margin-bottom:8px}
.panel p{margin:0 0 10px}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px}
.ctrl label{display:block;margin:3px 0}
.ctrl .row{display:flex;justify-content:space-between;gap:6px}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 6px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 4px;text-align:center;margin-top:4px}
.dirs label{margin:0}
.grad{height:12px;border-radius:3px;border:1px solid var(--line)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
.leg div{font-size:12.5px;margin:2px 0}
.stat{font-size:12.5px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
code{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.bivar{display:grid;grid-template-columns:28px repeat(8,1fr);gap:2px;font-size:11px;text-align:center;align-items:center}
.bivar span{height:14px;border-radius:2px}
.tip{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div>
    <div class="map" id="map">
      <canvas id="cv" width="160" height="160"></canvas>
      <div class="marker" id="marker"></div>
      <div class="north">▲<br>S</div>
    </div>
    <div class="below">
      <div class="readout" id="readout">Najeďte myší na mapu…</div>
      <button class="btn" id="newTerrain" title="Vygenerovat jiný terén">↻ Nový terén</button>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script>
// ---------- CORE-START ----------
const N = 160, CS = 25;                 // velikost rastru a buňky [m]
const D2R = Math.PI / 180;
const DEM = new Float32Array(N*N), DX = new Float32Array(N*N), DY = new Float32Array(N*N);
const SL = new Float32Array(N*N), AS = new Float32Array(N*N), HS = new Float32Array(N*N), VS = new Uint8Array(N*N);
let seed = 7;

function hash(ix, iy){
  let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 982451653);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx*fx*(3-2*fx), v = fy*fy*(3-2*fy);
  const a = hash(ix,iy), b = hash(ix+1,iy), c = hash(ix,iy+1), d = hash(ix+1,iy+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x, y, ridged){
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let o = 0; o < 5; o++){
    let n = vnoise(x*f + o*17.3, y*f - o*9.1);
    if (ridged) n = 1 - Math.abs(2*n - 1);
    s += amp*n; norm += amp; amp *= 0.5; f *= 2.03;
  }
  return s / norm;
}
function generate(){
  const cx = 0.35 + 0.3*hash(1,2), cy = 0.35 + 0.3*hash(3,4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const nx = x/N, ny = y/N;
    const dome = Math.exp(-((nx-cx)**2 + (ny-cy)**2) / 0.09);
    DEM[y*N+x] = 0.45*fbm(nx*3.2, ny*3.2, false) + 0.35*fbm(nx*2.4+5, ny*2.4+5, true)*(0.4+0.6*dome) + 0.45*dome;
  }
  // lehké vyhlazení (3×3 průměr)
  const tmp = Float32Array.from(DEM);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    let s = 0;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) s += tmp[cl(y+j)*N + cl(x+i)];
    DEM[y*N+x] = s/9;
  }
  let mn = Infinity, mx = -Infinity;
  for (const z of DEM){ if (z < mn) mn = z; if (z > mx) mx = z; }
  for (let k = 0; k < N*N; k++) DEM[k] = 700 + (DEM[k]-mn)/(mx-mn)*900;   // 700–1600 m
}
const cl = v => v < 0 ? 0 : v >= N ? N-1 : v;
const Z = (x, y) => DEM[cl(y)*N + cl(x)];

// Horn (3×3) – stejné jako Slope/Aspect v ArcGIS
function derive(){
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const a=Z(x-1,y-1), b=Z(x,y-1), c=Z(x+1,y-1), d=Z(x-1,y), f=Z(x+1,y), g=Z(x-1,y+1), h=Z(x,y+1), i=Z(x+1,y+1);
    const dx = ((c+2*f+i)-(a+2*d+g))/(8*CS), dy = ((g+2*h+i)-(a+2*b+c))/(8*CS);
    const k = y*N+x;
    DX[k] = dx; DY[k] = dy;
    SL[k] = Math.atan(Math.hypot(dx, dy)) / D2R;
    if (dx === 0 && dy === 0) AS[k] = -1;
    else { const t = Math.atan2(dy, -dx) / D2R; AS[k] = t < 0 ? 90 - t : t > 90 ? 450 - t : 90 - t; }
  }
}
function hillshade(az, alt, zf){
  const zen = (90-alt)*D2R;
  let azm = 360 - az + 90; if (azm >= 360) azm -= 360; azm *= D2R;
  const cz = Math.cos(zen), sz = Math.sin(zen);
  for (let k = 0; k < N*N; k++){
    const dx = DX[k]*zf, dy = DY[k]*zf, s = Math.atan(Math.hypot(dx, dy));
    let a;
    if (dx !== 0){ a = Math.atan2(dy, -dx); if (a < 0) a += 2*Math.PI; }
    else a = dy > 0 ? Math.PI/2 : dy < 0 ? 1.5*Math.PI : 0;
    const v = 255*(cz*Math.cos(s) + sz*Math.sin(s)*Math.cos(azm - a));
    HS[k] = v < 0 ? 0 : v;
  }
}
function bil(px, py){
  const x0 = Math.floor(px), y0 = Math.floor(py), fx = px-x0, fy = py-y0;
  const a = Z(x0,y0), b = Z(x0+1,y0), c = Z(x0,y0+1), d = Z(x0+1,y0+1);
  return a + (b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
}
function viewshed(ox, oy, offset){
  const oz = DEM[oy*N+ox] + offset;
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++){
    const k = ty*N+tx, ddx = tx-ox, ddy = ty-oy;
    if (!ddx && !ddy){ VS[k] = 1; continue; }
    const steps = Math.max(Math.abs(ddx), Math.abs(ddy)), L = Math.hypot(ddx, ddy)*CS;
    let maxT = -Infinity;
    for (let s = 1; s < steps; s++){
      const t = s/steps, tan = (bil(ox+ddx*t, oy+ddy*t) - oz)/(t*L);
      if (tan > maxT) maxT = tan;
    }
    VS[k] = (DEM[k]-oz)/L >= maxT ? 1 : 0;
  }
}
const dirIdx = a => a < 0 ? -1 : Math.floor(((a + 22.5) % 360) / 45);
// ---------- CORE-END ----------

const DIRS = ['S','SV','V','JV','J','JZ','Z','SZ'];
const DIR_COL = [[255,0,0],[255,165,0],[255,255,0],[0,255,0],[0,255,255],[0,165,255],[0,0,255],[255,0,255]];
const RAMP_DEM = [[0,[58,125,68]],[.25,[143,191,90]],[.5,[232,216,138]],[.75,[176,125,72]],[.9,[138,106,85]],[1,[244,241,236]]];
const RAMP_SL  = [[0,[255,247,188]],[15,[254,196,79]],[30,[230,85,13]],[45,[165,15,21]],[60,[74,20,134]]];
const C0 = [208,212,218], C1 = [30,99,181], CRISK = [211,47,47];
const SUMC = [[208,212,218],[255,224,130],[251,140,0],[211,47,47]];

function ramp(st, v){
  if (v <= st[0][0]) return st[0][1];
  for (let i = 1; i < st.length; i++) if (v <= st[i][0]){
    const [v0,c0] = st[i-1], [v1,c1] = st[i], t = (v-v0)/(v1-v0);
    return [c0[0]+(c1[0]-c0[0])*t, c0[1]+(c1[1]-c0[1])*t, c0[2]+(c1[2]-c0[2])*t];
  }
  return st[st.length-1][1];
}
const css = c => `rgb(${c.map(Math.round).join(',')})`;
function gradCss(st){
  const lo = st[0][0], hi = st[st.length-1][0];
  return `linear-gradient(to right,${st.map(([v,c]) => `${css(c)} ${((v-lo)/(hi-lo)*100).toFixed(0)}%`).join(',')})`;
}
function hsl(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12, a = s*Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));
  return [255*f(0), 255*f(8), 255*f(4)];
}
const AS_HUE = [0,32,56,120,180,205,235,300];
const slopeCls = s => s < 5 ? 0 : s < 20 ? 1 : s < 40 ? 2 : 3;
function aspSlopeCol(k){
  const c = slopeCls(SL[k]), d = dirIdx(AS[k]);
  if (c === 0 || d < 0) return [189,189,189];
  return c === 1 ? hsl(AS_HUE[d],40,80) : c === 2 ? hsl(AS_HUE[d],65,60) : hsl(AS_HUE[d],90,40);
}

// ---------- stav ----------
const S = {
  tab:'dmr', underlay:true,
  elevThr:1300, elevRc:false,
  slopeThr:30, slopeRc:false,
  dirs:[true,true,false,false,false,false,false,true], aspRc:false,
  az:315, alt:45, zf:1,
  ox:80, oy:80, off:20,
  combo:'mul'
};
const condE = k => DEM[k] >= S.elevThr ? 1 : 0;
const condS = k => SL[k] >= S.slopeThr ? 1 : 0;
const condA = k => { const d = dirIdx(AS[k]); return d >= 0 && S.dirs[d] ? 1 : 0; };
let demMin, demMax;
const ha = n => (n*CS*CS/1e4).toLocaleString('cs-CZ', {maximumFractionDigits:1});

function newTerrain(first){
  if (!first) seed = Math.floor(Math.random()*1e6);
  generate(); derive(); hillshade(S.az, S.alt, S.zf);
  demMin = Infinity; demMax = -Infinity; let mk = 0;
  for (let k = 0; k < N*N; k++){ if (DEM[k] < demMin) demMin = DEM[k]; if (DEM[k] > demMax){ demMax = DEM[k]; mk = k; } }
  S.elevThr = Math.round(demMin + 2*(demMax-demMin)/3);
  S.ox = mk % N; S.oy = Math.floor(mk / N);
  viewshed(S.ox, S.oy, S.off);
  renderPanel(); draw();
}

// ---------- záložky a panely ----------
const TABS = [
  ['dmr','DMR'],['slope','Slope'],['aspect','Aspect'],['hillshade','Hillshade'],
  ['viewshed','Viewshed'],['aspectslope','Aspect-Slope'],['combo','Raster Calculator']
];
const underlayBox = `<label><input type="checkbox" data-k="underlay"> Stínovaný reliéf pod vrstvou</label>`;

function panelHtml(){
  switch (S.tab){
  case 'dmr': return `
    <h3>DMR – digitální model reliéfu</h3><div class="tool">vstupní rastr · <i>RECLASSIFY</i></div>
    <p>Každá buňka nese nadmořskou výšku. Z tohoto rastru odvodíme všechny ostatní vrstvy. Rozlišení je 25&nbsp;m, terén je syntetický.</p>
    <div class="ctrl">
      <label><input type="checkbox" data-k="elevRc"> <b>Reklasifikovat</b> na 0 / 1</label>
      <div class="row"><span>mezní výška</span><span><span data-v="elevThr"></span> m</span></div>
      <input type="range" data-k="elevThr" min="700" max="1600" step="10">
      <button class="btn" id="third">Nejvyšší třetina</button>
      ${underlayBox}
    </div>`;
  case 'slope': return `
    <h3><i>SLOPE</i> – sklon svahu</h3><div class="tool">3D Analyst / Spatial Analyst › <i>SLOPE</i></div>
    <p>Funkce spočítá z okna 3×3 buněk (metoda Horn) největší změnu výšky a vyjádří ji jako úhel ve stupních: 0° je rovina, 90° svislá stěna. Směr svahu tu nehraje roli, jen jeho strmost.</p>
    <div class="ctrl">
      <label><input type="checkbox" data-k="slopeRc"> <b>Reklasifikovat</b> na 0 / 1</label>
      <div class="row"><span>mezní sklon</span><span><span data-v="slopeThr"></span>°</span></div>
      <input type="range" data-k="slopeThr" min="0" max="60" step="1">
      ${underlayBox}
    </div>`;
  case 'aspect': return `
    <h3><i>ASPECT</i> – expozice svahu</h3><div class="tool">3D Analyst / Spatial Analyst › <i>ASPECT</i></div>
    <p>Směr, kterým svah <i>klesá</i>, vyjádřený azimutem 0–360° od severu po směru hodinových ručiček. Rovina má hodnotu −1.</p>
    <p class="tip">Sever leží „na švu“ stupnice (0°&nbsp;=&nbsp;360°), takže ho při reklasifikaci poskládáme ze dvou intervalů: 0–22,5° a 337,5–360°.</p>
    <div class="ctrl">
      <label><input type="checkbox" data-k="aspRc"> <b>Reklasifikovat</b> – vyhovující směry:</label>
      <div class="dirs">${[7,0,1,6,-1,2,5,4,3].map(i => i < 0 ? '<span>✛</span>' :
        `<label><input type="checkbox" data-dir="${i}"> ${DIRS[i]}</label>`).join('')}</div>
      ${underlayBox}
    </div>`;
  case 'hillshade': return `
    <h3><i>HILLSHADE</i> – stínovaný reliéf</h3><div class="tool">3D Analyst / Spatial Analyst › <i>HILLSHADE</i></div>
    <p>Funkce simuluje osvětlení povrchu zdrojem daným azimutem a výškou nad obzorem. Hodnota 0–255 vyjadřuje, jak přímo světlo na buňku dopadá. Používáme ji hlavně k vizualizaci.</p>
    <div class="ctrl">
      <div class="row"><span>azimut světla</span><span><span data-v="az"></span>°</span></div>
      <input type="range" data-k="az" min="0" max="360" step="5">
      <div class="row"><span>výška nad obzorem</span><span><span data-v="alt"></span>°</span></div>
      <input type="range" data-k="alt" min="1" max="90" step="1">
      <div class="row"><span>Z-faktor (převýšení)</span><span>× <span data-v="zf"></span></span></div>
      <input type="range" data-k="zf" min="0.5" max="5" step="0.5">
    </div>
    <p class="tip">Zkuste azimut kolem 135°: údolí mohou začít vypadat jako hřbety (tzv. inverze reliéfu). Proto je výchozí 315°, světlo od SZ.</p>`;
  case 'viewshed': return `
    <h3><i>VIEWSHED</i> – analýza viditelnosti</h3><div class="tool">Spatial Analyst › <i>VIEWSHED</i></div>
    <p>Funkce určí buňky, které jsou vidět z pozorovacího bodu. U každé buňky testuje, zda přímku pohledu nepřeruší terén.</p>
    <div class="ctrl">
      <p style="margin:0 0 6px"><b>Klikněte do mapy</b> pro přesun pozorovatele.</p>
      <div class="row"><span>výška nad terénem (<i>OFFSETA</i>)</span><span><span data-v="off"></span> m</span></div>
      <input type="range" data-k="off" min="0" max="100" step="1">
      <button class="btn" id="peak">Pozorovatel na nejvyšší bod</button>
    </div>
    <p class="tip">Zkuste na vrcholu snížit výšku na 2&nbsp;m. Z vypouklého vrcholu nejsou vidět jeho vlastní svahy, protože je zakryje hrana terénu. Výchozích 20&nbsp;m odpovídá rozhledně.</p>`;
  case 'aspectslope': return `
    <h3><i>ASPECT-SLOPE</i></h3><div class="tool">rastrová funkce ArcGIS Pro</div>
    <p>Funkce kombinuje dvě veličiny v jedné vrstvě. Barevný tón nese <b>expozici</b>, sytost nese <b>sklon</b>. Ploché oblasti (&lt;&nbsp;5°) jsou šedé.</p>
    <div class="ctrl">${underlayBox}</div>`;
  case 'combo': return `
    <h3><i>RASTER CALCULATOR</i></h3><div class="tool">Spatial Analyst › <i>RASTER CALCULATOR</i></div>
    <p>Reklasifikované vrstvy (0/1) z DMR, sklonu a expozice zkombinujeme. Mezní hodnoty nastavíte v příslušných záložkách. Krajinný pokryv (CLC) tu pro jednoduchost chybí.</p>
    <div class="ctrl">
      <label><input type="radio" name="combo" value="mul"> součin – platí <b>všechny</b> podmínky</label>
      <label><input type="radio" name="combo" value="sum"> součet – <b>kolik</b> podmínek platí</label>
      <div style="margin-top:6px"><code id="expr"></code></div>
      ${underlayBox}
    </div>`;
  }
}

function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const P = document.getElementById('panel');
  P.innerHTML = panelHtml() + '<div class="leg" id="legend"></div>';
  P.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') el.checked = S[k]; else el.value = S[k];
    el.addEventListener('input', () => { S[k] = el.type === 'checkbox' ? el.checked : +el.value; changed(k); });
  });
  P.querySelectorAll('[data-dir]').forEach(el => {
    const i = +el.dataset.dir; el.checked = S.dirs[i];
    el.addEventListener('input', () => { S.dirs[i] = el.checked; S.aspRc = true; changed('dirs'); });
  });
  P.querySelectorAll('input[name=combo]').forEach(el => {
    el.checked = el.value === S.combo;
    el.addEventListener('input', () => { S.combo = el.value; changed('combo'); });
  });
  const third = document.getElementById('third');
  if (third) third.onclick = () => { S.elevThr = Math.round(demMin + 2*(demMax-demMin)/3); S.elevRc = true; renderPanel(); draw(); };
  const peak = document.getElementById('peak');
  if (peak) peak.onclick = () => { let mk = 0; for (let k = 0; k < N*N; k++) if (DEM[k] > DEM[mk]) mk = k; S.ox = mk % N; S.oy = Math.floor(mk/N); dirtyVS = true; schedule(); };
  labels();
}
function labels(){
  document.querySelectorAll('[data-v]').forEach(el => el.textContent = S[el.dataset.v]);
  document.querySelectorAll('[data-dir]').forEach(el => el.checked = S.dirs[+el.dataset.dir]);
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') el.checked = S[k];
    else if (+el.value !== S[k]) el.value = S[k];
  });
  const ex = document.getElementById('expr');
  if (ex) ex.textContent = S.combo === 'mul' ? '"vyska" * "sklon" * "expozice"' : '"vyska" + "sklon" + "expozice"';
}

let dirtyHS = false, dirtyVS = false, queued = false;
function changed(k){
  if (k === 'slopeThr') S.slopeRc = true;
  if (k === 'elevThr') S.elevRc = true;
  if (k === 'az' || k === 'alt' || k === 'zf') dirtyHS = true;
  if (k === 'off') dirtyVS = true;
  labels(); schedule();
}
function schedule(){
  if (queued) return; queued = true;
  requestAnimationFrame(() => {
    queued = false;
    if (dirtyHS){ hillshade(S.az, S.alt, S.zf); dirtyHS = false; }
    if (dirtyVS){ viewshed(S.ox, S.oy, S.off); dirtyVS = false; }
    draw();
  });
}

// ---------- vykreslení ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function colorAt(k){
  switch (S.tab){
    case 'dmr': return S.elevRc ? (condE(k) ? C1 : C0) : ramp(RAMP_DEM, (DEM[k]-demMin)/(demMax-demMin));
    case 'slope': return S.slopeRc ? (condS(k) ? C1 : C0) : ramp(RAMP_SL, SL[k]);
    case 'aspect': {
      if (S.aspRc) return condA(k) ? C1 : C0;
      const d = dirIdx(AS[k]); return d < 0 ? [160,160,160] : DIR_COL[d];
    }
    case 'hillshade': return [HS[k],HS[k],HS[k]];
    case 'viewshed': { const h = 40 + HS[k]*0.7; return VS[k] ? [h*0.45, 90 + h*0.6, h*0.35] : [h,h,h]; }
    case 'aspectslope': return aspSlopeCol(k);
    case 'combo': {
      if (S.combo === 'mul') return condE(k)*condS(k)*condA(k) ? CRISK : C0;
      return SUMC[condE(k)+condS(k)+condA(k)];
    }
  }
}
function draw(){
  const img = ctx.createImageData(N, N), p = img.data;
  const under = S.underlay && !['hillshade','viewshed'].includes(S.tab);
  for (let k = 0; k < N*N; k++){
    const c = colorAt(k), f = under ? 0.55 + 0.45*HS[k]/255 : 1;
    p[4*k] = c[0]*f; p[4*k+1] = c[1]*f; p[4*k+2] = c[2]*f; p[4*k+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const m = document.getElementById('marker');
  m.style.display = S.tab === 'viewshed' ? 'block' : 'none';
  m.style.left = ((S.ox+.5)/N*100) + '%'; m.style.top = ((S.oy+.5)/N*100) + '%';
  legend();
}
function count(fn){ let n = 0; for (let k = 0; k < N*N; k++) n += fn(k); return n; }
const bin = (n) => `<div><span class="sw" style="background:${css(C1)}"></span>1 – vyhovuje (${ha(n)} ha)</div>
  <div><span class="sw" style="background:${css(C0)}"></span>0 – nevyhovuje</div>`;

function legend(){
  const L = document.getElementById('legend'); if (!L) return;
  const tot = `<div class="stat">Celé území: ${ha(N*N)} ha (${N}×${N} buněk po ${CS} m)</div>`;
  switch (S.tab){
    case 'dmr':
      L.innerHTML = S.elevRc ? bin(count(condE)) + `<div class="stat">Podmínka: výška ≥ ${S.elevThr} m</div>` + tot
        : `<div class="grad" style="background:${gradCss(RAMP_DEM)}"></div><div class="gl"><span>${Math.round(demMin)} m</span><span>${Math.round(demMax)} m</span></div>` + tot;
      break;
    case 'slope':
      L.innerHTML = S.slopeRc ? bin(count(condS)) + `<div class="stat">Podmínka: sklon ≥ ${S.slopeThr}°</div>` + tot
        : `<div class="grad" style="background:${gradCss(RAMP_SL)}"></div><div class="gl"><span>0°</span><span>30°</span><span>60°+</span></div>` + tot;
      break;
    case 'aspect':
      L.innerHTML = S.aspRc ? bin(count(condA)) + `<div class="stat">Podmínka: ${DIRS.filter((d,i) => S.dirs[i]).join(', ') || '—'}</div>` + tot
        : DIRS.map((d,i) => `<div><span class="sw" style="background:${css(DIR_COL[i])}"></span>${d} (${(i*45-22.5+360)%360}–${i*45+22.5}°)</div>`).join('')
          + `<div><span class="sw" style="background:#a0a0a0"></span>rovina (−1)</div>`;
      break;
    case 'hillshade':
      L.innerHTML = `<div class="grad" style="background:linear-gradient(to right,#000,#fff)"></div><div class="gl"><span>0 (stín)</span><span>255 (plné světlo)</span></div>`;
      break;
    case 'viewshed': {
      const v = count(k => VS[k]);
      L.innerHTML = `<div><span class="sw" style="background:rgb(60,170,50)"></span>viditelné (${ha(v)} ha, ${(v/N/N*100).toFixed(1)} %)</div>
        <div><span class="sw" style="background:#999"></span>neviditelné</div>
        <div class="stat">Pozorovatel: ${Math.round(DEM[S.oy*N+S.ox])} m + ${S.off} m</div>`;
      break;
    }
    case 'aspectslope':
      L.innerHTML = `<div class="bivar"><b></b>${DIRS.map(d => `<b>${d}</b>`).join('')}
        ${[[3,'>40°'],[2,'20–40°'],[1,'5–20°']].map(([c,t]) => `<b style="font-weight:400">${t}</b>` +
          AS_HUE.map(h => `<span style="background:${css(c === 1 ? hsl(h,40,80) : c === 2 ? hsl(h,65,60) : hsl(h,90,40))}"></span>`).join('')).join('')}
        </div><div style="margin-top:6px"><span class="sw" style="background:#bdbdbd"></span>rovina (&lt; 5°)</div>`;
      break;
    case 'combo': {
      const cond = `<div class="stat">výška ≥ ${S.elevThr} m · sklon ≥ ${S.slopeThr}° · expozice ${DIRS.filter((d,i) => S.dirs[i]).join(', ') || '—'}</div>`;
      if (S.combo === 'mul'){
        const n = count(k => condE(k)*condS(k)*condA(k));
        L.innerHTML = `<div><span class="sw" style="background:${css(CRISK)}"></span>1 – splněny všechny (${ha(n)} ha)</div>
          <div><span class="sw" style="background:${css(C0)}"></span>0 – aspoň jedna nesplněna</div>` + cond;
      } else {
        const c = [0,0,0,0]; for (let k = 0; k < N*N; k++) c[condE(k)+condS(k)+condA(k)]++;
        L.innerHTML = c.map((n,i) => `<div><span class="sw" style="background:${css(SUMC[i])}"></span>${i} – ${ha(n)} ha</div>`).join('') + cond;
      }
      break;
    }
  }
}

// ---------- myš ----------
const map = document.getElementById('map'), ro = document.getElementById('readout');
function cellAt(e){
  const r = map.getBoundingClientRect();
  return [cl(Math.floor((e.clientX-r.left)/r.width*N)), cl(Math.floor((e.clientY-r.top)/r.height*N))];
}
map.addEventListener('mousemove', e => {
  const [x,y] = cellAt(e), k = y*N+x, d = dirIdx(AS[k]);
  let t = `Z ${Math.round(DEM[k])} m · sklon ${SL[k].toFixed(1)}° · exp. ${AS[k] < 0 ? '−1' : Math.round(AS[k]) + '° (' + DIRS[d] + ')'} · HS ${Math.round(HS[k])}`;
  if (S.tab === 'viewshed') t += VS[k] ? ' · viditelné' : ' · skryté';
  ro.textContent = t;
});
map.addEventListener('mouseleave', () => ro.textContent = 'Najeďte myší na mapu…');
map.addEventListener('click', e => {
  if (S.tab !== 'viewshed') return;
  [S.ox, S.oy] = cellAt(e); dirtyVS = true; schedule();
});

document.getElementById('tabs').innerHTML = TABS.map(([t,n]) => `<button data-t="${t}">${n}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderPanel(); draw(); });
document.getElementById('newTerrain').onclick = () => newTerrain(false);
newTerrain(true);

// ---------- napojení na web (MkDocs Material) ----------
// Stránka je vložená přes iframe ze stejného webu, takže můžeme číst rodiče:
// převezmeme barvy a přepínač světlý/tmavý režim a výšku iframe přizpůsobíme obsahu.
(function(){
  let host = null;
  try { host = window.frameElement && window.parent.document.body; } catch(e) {}
  if (host){
    const root = document.documentElement;
    const sync = () => {
      const scheme = host.getAttribute('data-md-color-scheme');
      root.setAttribute('data-theme', scheme === 'slate' ? 'dark' : 'light');
      const cs = window.parent.getComputedStyle(host);
      const v = n => cs.getPropertyValue(n).trim();
      [['--bg','--md-default-bg-color'],['--fg','--md-default-fg-color'],['--muted','--md-default-fg-color--light'],
       ['--line','--md-default-fg-color--lightest'],['--card','--md-code-bg-color'],['--accent','--md-primary-fg-color'],
       ['--accent-fg','--md-primary-bg-color']].forEach(([a,b]) => { const x = v(b); if (x) root.style.setProperty(a, x); });
    };
    sync();
    new MutationObserver(sync).observe(host, {attributes:true, attributeFilter:['data-md-color-scheme']});
    const fit = () => { window.frameElement.style.height = Math.ceil(document.documentElement.scrollHeight) + 'px'; };
    new ResizeObserver(fit).observe(document.body);
    fit();
  }
})();
</script>
